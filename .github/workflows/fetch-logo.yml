name: Fetch logo

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-logo.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download logo
        run: |
          curl -L --fail -sS -o logo.png "https://i.ibb.co/TBQw2ZXX/file-0000000069108208a2f51456ff2bfbc5.png"
          ls -la logo.png

      - name: Validate PNG
        run: |
          if head -c 8 logo.png | od -An -tx1 | grep -qi "89 50 4e 47"; then
            echo "PNG OK"
          else
            echo "Downloaded file is NOT a PNG"
            exit 1
          fi

      - name: Copy into assets
        run: |
          cp logo.png assets/logo.png
          cp logo.png assets/logo-transparent.png

      - name: Commit and push (best effort)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No change (image identical to existing assets)"
          else
            git add assets/logo.png assets/logo-transparent.png
            git commit -m "chore: use exact logo image for assets/logo.png"
            git push
          fi

      - name: Upload logo artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logo
          path: logo.png
          if-no-files-found: error
