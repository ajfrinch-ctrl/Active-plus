<!DOCTYPE html>
<html lang="bn" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Active Plus · হোম</title>
    <meta name="theme-color" content="#05070a">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Active Plus">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/modern.css">
    <link rel="stylesheet" href="css/student-v2.css">
    <!-- Fonts load without blocking first paint: a slow CDN must never
         leave the app staring at a blank "loading" screen. Degrades to
         system fonts when the CDN cannot be reached. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap"></noscript>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  </head>

  <body class="home-body">
    <main class="home">
      <!-- Top bar: who am I + today's date. The "অনলাইন" chip is gone — the
           border of the bar itself turns green while the app is online (and
           amber while offline), which is what the student is told instead. -->
      <header class="home-header home-header-fixed" id="home-header" data-net="online">
        <div class="avatar" id="avatar" aria-hidden="true">A</div>
        <div class="who">
          <div class="greet" id="greet">…</div>
          <div class="name" id="student-name">…</div>
          <div class="meta" id="student-meta">…</div>
        </div>
        <div class="hh-actions">
          <button type="button" class="bell" id="bell" aria-label="নোটিফিকেশন">🔔<span class="badge-dot" id="bell-count" hidden>0</span></button>
          <button type="button" class="icon-btn" id="profile-btn" aria-label="প্রোফাইল" aria-haspopup="true" aria-expanded="false" title="প্রোফাইল">👤</button>
          <div class="profile-menu" id="student-profile-menu" hidden>
            <div class="pm-head">
              <div class="pm-avatar" id="pm-avatar" aria-hidden="true">👤</div>
              <div class="pm-id"><strong id="pm-name">শিক্ষার্থী</strong><small id="pm-detail">—</small></div>
            </div>
            <button type="button" class="pm-item" id="pm-view-profile"><span aria-hidden="true">👤</span> প্রোফাইল</button>
            <button type="button" class="pm-item" id="pm-settings"><span aria-hidden="true">⚙️</span> সেটিংস</button>
            <button type="button" class="pm-item pm-danger" id="logout-btn"><span aria-hidden="true">🚪</span> লগআউট</button>
          </div>
        </div>
        <div class="hh-strip">
          <span class="hh-date" id="today-date">…</span>
          <span class="hh-year" id="today-session">…</span>
        </div>
      </header>

      <!-- HOME view -->
      <section id="view-home" class="home-view">
        <div id="home-skeleton" aria-busy="true" aria-live="polite">
          <div class="hcard skeleton"><div class="sk-line" style="width:40%"></div><div class="sk-line" style="width:70%"></div></div>
          <div class="hcard skeleton"><div class="sk-line" style="width:55%"></div><div class="sk-line" style="width:80%"></div></div>
        </div>
        <div id="home-content" hidden></div>
      </section>

      <!-- STUDY view -->
      <section id="view-study" class="home-view" hidden>
        <h2 class="section-title">স্টাডি ম্যাটেরিয়াল</h2>
        <div id="material-list"></div>
        <h2 class="section-title">সাজেশন</h2>
        <div id="student-suggestion-list"></div>
      </section>

      <!-- EXAM view -->
      <section id="view-exam" class="home-view" hidden>
        <h2 class="section-title">MCQ পরীক্ষা</h2>
        <div class="list" id="student-exam-list"></div>
        <div id="exam-player" hidden></div>
      </section>

      <!-- RESULT view -->
      <section id="view-result" class="home-view" hidden>
        <div id="result-content"></div>
      </section>

      <!-- MORE view -->
      <section id="view-more" class="home-view" hidden>
        <div id="more-content"></div>
      </section>
    </main>

    <!-- Notification center modal -->
    <div class="modal-overlay" id="notif-center" aria-hidden="true">
      <div class="modal-content" role="dialog" aria-modal="true">
        <button type="button" class="modal-close" data-close aria-label="বন্ধ করুন">×</button>
        <h2>নোটিফিকেশন</h2>
        <div class="list" id="notif-list"></div>
      </div>
    </div>

    <!-- Bottom navigation -->
    <nav class="bottom-nav" aria-label="মূল নেভিগেশন">
      <div class="inner">
        <i class="nav-ink" id="nav-ink" aria-hidden="true"></i>
        <button type="button" data-view="home" aria-current="true"><span class="ico">🏠</span>হোম</button>
        <button type="button" data-view="study"><span class="ico">📚</span>স্টাডি</button>
        <button type="button" data-view="exam"><span class="ico">📝</span>পরীক্ষা</button>
        <button type="button" data-view="result"><span class="ico">🏆</span>ফলাফল</button>
        <button type="button" data-view="more"><span class="ico">⋯</span>আরও</button>
      </div>
    </nav>

    <div class="toast-container" id="toast-container" aria-live="polite"></div>

    <script type="module">
      import { initStudentHome } from './js/student-home.js';
      initStudentHome();
      /* Boot-watchdog marker: the module finished wiring this page. */
      document.body.dataset.boot = 'ok';
</script>

    <!-- Boot watchdog: if the module script never finished (very old browser,
         a blocked script, or an error while booting) say so and offer a reload
         instead of leaving a spinner or skeleton on screen forever. -->
    <script>
      (function () {
        var shown = false;
        function booted() { return document.body && document.body.getAttribute('data-boot') === 'ok'; }
        function showBootHelp() {
          if (shown || booted()) return;
          shown = true;
          var box = document.createElement('div');
          box.setAttribute('role', 'alert');
          box.setAttribute('style', 'position:fixed;left:0;right:0;bottom:0;z-index:99999;display:flex;justify-content:center;padding:1rem;');
          box.innerHTML =
            '<div style="max-width:26rem;width:100%;background:#1b1f27;color:#f1f5f9;border:1px solid #374151;' +
              'border-radius:1rem;padding:1rem 1.15rem;box-shadow:0 12px 32px rgba(0,0,0,.55);' +
              'font-family:\'Hind Siliguri\',\'Noto Sans Bengali\',system-ui,sans-serif">' +
              '<strong style="display:block;font-size:1.02rem;margin-bottom:.3rem">⚠️ পেজটি ঠিকমতো লোড হয়নি</strong>' +
              '<p style="margin:.2rem 0;font-size:.9rem;line-height:1.65;color:#cbd5e1">' +
                'ইন্টারনেট সংযোগ দেখে পেজটি রিফ্রেশ করুন। পুরনো ব্রাউজারে সমস্যা হলে সর্বশেষ Chrome বা Firefox দিয়ে খুলুন।' +
              '</p>' +
              '<div style="display:flex;gap:.5rem;margin-top:.6rem">' +
                '<button data-boot-act="retry" style="flex:1;background:#2563eb;border:0;color:#fff;border-radius:.6rem;' +
                  'padding:.55rem .9rem;font-size:.92rem;cursor:pointer">🔄 রিফ্রেশ করুন</button>' +
                '<button data-boot-act="dismiss" style="background:transparent;border:1px solid #4b5563;color:#cbd5e1;' +
                  'border-radius:.6rem;padding:.55rem .9rem;font-size:.92rem;cursor:pointer">পরে দেখব</button>' +
              '</div>' +
            '</div>';
          document.body.appendChild(box);
          box.querySelector('[data-boot-act="retry"]').addEventListener('click', function () { window.location.reload(); });
          box.querySelector('[data-boot-act="dismiss"]').addEventListener('click', function () { box.remove(); shown = false; });
        }
        /* Module scripts have either run or failed by window 'load'. A couple of
           generous fallbacks cover browsers where 'load' itself is delayed. */
        window.addEventListener('load', function () { setTimeout(showBootHelp, 4000); });
        setTimeout(function () { if (document.readyState === 'complete') showBootHelp(); }, 12000);
        setTimeout(showBootHelp, 30000);
      })();
    </script>

    <noscript>
      <div style="position:fixed;left:0;right:0;bottom:0;z-index:99999;display:flex;justify-content:center;padding:1rem;">
        <div style="max-width:26rem;width:100%;background:#1b1f27;color:#f1f5f9;border:1px solid #374151;border-radius:1rem;padding:1rem 1.15rem;font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif">
          <strong>⚠️ জাভাস্ক্রিপ্ট বন্ধ আছে</strong>
          <p style="margin:.3rem 0;font-size:.9rem;line-height:1.6;color:#cbd5e1">Active Plus চালাতে ব্রাউজারে JavaScript চালু থাকতে হবে। JavaScript অন করে পেজটি আবার খুলুন।</p>
        </div>
      </div>
    </noscript>
  </body>
</html>
