<!DOCTYPE html>
<html lang="bn" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>লগিন · Active Plus Coaching Management System</title>
    <meta name="description" content="Active Plus Coaching Management System — শিক্ষার্থী, শিক্ষক ও অ্যাডমিন পোর্টাল।">
    <meta name="theme-color" content="#2d3748">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Active Plus">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  </head>

  <body class="auth-body">
    <main class="auth-shell">
      <header class="auth-head">
        <div class="logo" aria-hidden="true"><div class="logo-icon">📚</div></div>
        <h1>Active Plus</h1>
        <p class="subtitle">Coaching Management System</p>
      </header>

      <section class="login-card" aria-labelledby="login-title">
        <h2 id="login-title" class="sr-only">লগিন ফর্ম</h2>

        <form id="login-form" novalidate>
          <fieldset class="role-options">
            <legend>আপনি কে?</legend>
            <div class="role-grid">
              <label class="role-option">
                <input type="radio" name="role" value="student" checked>
                <span class="role-emoji" aria-hidden="true">🎓</span>
                <span>শিক্ষার্থী</span>
              </label>
              <label class="role-option">
                <input type="radio" name="role" value="teacher">
                <span class="role-emoji" aria-hidden="true">🧑‍🏫</span>
                <span>শিক্ষক</span>
              </label>
              <label class="role-option">
                <input type="radio" name="role" value="admin">
                <span class="role-emoji" aria-hidden="true">🛡️</span>
                <span>অ্যাডমিন</span>
              </label>
            </div>
          </fieldset>

          <div class="form-group">
            <label for="login-input">ইমেইল অথবা স্টুডেন্ট আইডি</label>
            <input
              type="text"
              id="login-input"
              name="identifier"
              placeholder="যেমন: 2026-09-001 অথবা name@example.com"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              inputmode="email"
              required>
          </div>

          <div class="form-group">
            <label for="login-password">পাসওয়ার্ড</label>
            <div class="input-wrap">
              <input
                type="password"
                id="login-password"
                name="password"
                placeholder="আপনার পাসওয়ার্ড"
                autocomplete="current-password"
                required>
              <button type="button" class="toggle-password" id="toggle-password" aria-pressed="false" aria-label="পাসওয়ার্ড দেখান">
                দেখুন
              </button>
            </div>
          </div>

          <p class="form-error" id="login-error" role="alert" aria-live="assertive"></p>

          <button type="submit" class="btn-login" id="login-btn">লগিন করুন</button>
        </form>

        <div class="status-bar" id="status-bar" aria-live="polite">
          <span id="status-text">সংযোগ পরীক্ষা করা হচ্ছে…</span>
        </div>

        <div class="demo-box" id="demo-box">
          <h2>ডেমো অ্যাকাউন্ট</h2>
          <ul id="demo-list"></ul>
        </div>
      </section>

      <p class="hint">
        © ২০২৬ Active Plus Coaching Management System<br>
        মোবাইল, ট্যাব ও ডেস্কটপ — সব স্ক্রিনে কাজ করে।
      </p>
    </main>

    <div class="toast-container" id="toast-container" aria-live="polite"></div>

    <script type="module">
      import { initFirebase, checkConnectionStatus, getAuthMode, showToast } from './js/firebase.js';
      import { signIn, DEMO_ACCOUNTS, homeFor, ROLES, currentSession } from './js/auth.js';

      const ALLOWED_PAGES = ['student.html', 'teacher.html', 'admin.html'];

      const form = document.getElementById('login-form');
      const input = document.getElementById('login-input');
      const password = document.getElementById('login-password');
      const loginBtn = document.getElementById('login-btn');
      const errorBox = document.getElementById('login-error');
      const statusText = document.getElementById('status-text');
      const statusBar = document.getElementById('status-bar');
      const togglePassword = document.getElementById('toggle-password');

      const selectedRole = () => form.elements.role?.value || 'student';

      const setStatus = (message, tone = '') => {
        statusText.textContent = message;
        statusBar.className = `status-bar ${tone}`.trim();
      };

      const showError = (message) => {
        errorBox.textContent = message || '';
        errorBox.classList.toggle('visible', Boolean(message));
      };

      /** Keeps the "chosen" styling in sync without relying on :has(). */
      const syncRoleOptions = () => {
        document.querySelectorAll('.role-option').forEach((label) => {
          const radio = label.querySelector('input[type="radio"]');
          label.toggleAttribute('data-checked', Boolean(radio?.checked));
        });
      };

      const setLoading = (isLoading) => {
        loginBtn.disabled = isLoading;
        loginBtn.innerHTML = isLoading
          ? '<span class="spinner" aria-hidden="true"></span> লগিন হচ্ছে…'
          : 'লগিন করুন';
      };

      /** Only allow redirects to our own dashboards. */
      const safeNext = () => {
        const next = new URLSearchParams(window.location.search).get('next');
        return ALLOWED_PAGES.includes(next) ? next : null;
      };

      const renderDemoAccounts = () => {
        const list = document.getElementById('demo-list');
        list.innerHTML = '';
        DEMO_ACCOUNTS.forEach((account) => {
          const item = document.createElement('li');
          const info = document.createElement('div');
          info.innerHTML = `<strong>${account.label}</strong> · <code>${account.username}</code><br><code>${account.password}</code>`;
          const fill = document.createElement('button');
          fill.type = 'button';
          fill.textContent = 'ব্যবহার করুন';
          fill.addEventListener('click', () => {
            input.value = account.username;
            password.value = account.password;
            const radio = form.elements.role?.value;
            const target = form.querySelector(`input[name="role"][value="${account.role}"]`);
            if (target) { target.checked = true; syncRoleOptions(); }
            showError('');
            password.focus();
            void radio;
          });
          item.append(info, fill);
          list.appendChild(item);
        });
      };

      form.elements.role?.addEventListener?.('change', syncRoleOptions);
      form.querySelectorAll('input[name="role"]').forEach((radio) => {
        radio.addEventListener('change', () => { syncRoleOptions(); showError(''); });
      });

      togglePassword.addEventListener('click', () => {
        const show = password.type === 'password';
        password.type = show ? 'text' : 'password';
        togglePassword.textContent = show ? 'লুকান' : 'দেখুন';
        togglePassword.setAttribute('aria-pressed', String(show));
        password.focus();
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        showError('');

        const identifier = input.value.trim();
        const secret = password.value;
        const role = selectedRole();

        if (!identifier || !secret) {
          showError('ইউজারনেইম/স্টুডেন্ট আইডি এবং পাসওয়ার্ড দুটোই দিন।');
          (!identifier ? input : password).focus();
          return;
        }
        if (!ROLES.includes(role)) {
          showError('একটি ভূমিকা নির্বাচন করুন।');
          return;
        }

        setLoading(true);
        try {
          const session = await signIn(identifier, secret, role);
          setStatus(`স্বাগতম, ${session.name}!`, 'connected');
          showToast(`সফলভাবে লগিন হয়েছে — ${session.name}`, 'success');
          window.location.replace(safeNext() || homeFor(session.role));
        } catch (error) {
          console.warn('[Active Plus] Login failed:', error.code || '', error.message);
          showError(error.message || 'লগিন করা যায়নি। আবার চেষ্টা করুন।');
          setLoading(false);
          password.select();
        }
      });

      const boot = async () => {
        syncRoleOptions();
        renderDemoAccounts();

        const session = currentSession();
        if (session) {
          setStatus(`আগে থেকেই লগিন করা আছে — ${session.name}`, 'connected');
          window.location.replace(safeNext() || homeFor(session.role));
          return;
        }

        try {
          await initFirebase();
          if (getAuthMode() === 'firebase') {
            const connected = await checkConnectionStatus();
            setStatus(connected ? 'ডেটাবেস সংযুক্ত ●' : 'ডেটাবেস সংযোগ পাওয়া যায়নি ●', connected ? 'connected' : 'disconnected');
          } else {
            setStatus('লোকাল মোড চালু — ডেটা এই ডিভাইসে সংরক্ষিত থাকবে ●', 'connected');
          }
        } catch (error) {
          console.error('[Active Plus] init error:', error);
          setStatus('লোকাল মোড চালু ●', 'disconnected');
        }
        input.focus({ preventScroll: true });
      };

      boot();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('service-worker.js').catch((error) => {
            console.warn('[Active Plus] Service worker registration failed:', error.message);
          });
        });
      }
    </script>
  </body>
</html>
