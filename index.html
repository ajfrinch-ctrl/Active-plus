<!DOCTYPE html>
<html lang="bn" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>লগিন · Active Plus</title>
    <meta name="description" content="Active Plus — শিক্ষার্থী, শিক্ষক ও অ্যাডমিন পোর্টাল।">
    <meta name="theme-color" content="#05070a">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Active Plus">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/modern.css">
    <!-- Bengali font (Hind Siliguri) is bundled in assets/fonts/ (see
         css/fonts.css) — the app UI and every receipt/report it renders
         work with no internet connection. -->
    <link rel="stylesheet" href="css/fonts.css">

    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  </head>

  <body class="auth-body">
    <main class="auth-shell">
      <header class="auth-head">
        <div class="logo" aria-hidden="true"><img class="logo-img" src="assets/logo.png" alt="Active Plus"></div>
        <!-- Filled from the institute profile the admin writes in Settings. -->
        <p class="org-line" id="org-line" hidden>
          <strong id="org-line-name"></strong>
          <span id="org-line-detail"></span>
        </p>
      </header>

      <section class="login-card" aria-labelledby="login-title">
        <h2 id="login-title" class="sr-only">লগিন ফর্ম</h2>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-input">ইমেইল অথবা স্টুডেন্ট আইডি</label>
            <input
              type="text"
              id="login-input"
              name="identifier"
              placeholder="যেমন: 2026-09-001 অথবা name@example.com"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              inputmode="email"
              required>
          </div>

          <div class="form-group">
            <label for="login-password">পাসওয়ার্ড</label>
            <div class="input-wrap">
              <input
                type="password"
                id="login-password"
                name="password"
                placeholder="আপনার পাসওয়ার্ড"
                autocomplete="current-password"
                required>
              <button type="button" class="toggle-password" id="toggle-password" aria-pressed="false" aria-label="পাসওয়ার্ড দেখান">
                দেখুন
              </button>
            </div>
          </div>

          <p class="form-error" id="login-error" role="alert" aria-live="assertive"></p>

          <button type="submit" class="btn-login" id="login-btn">লগিন করুন</button>
        </form>

        <!-- Installable PWA: shown only while Chrome offers installation. -->
        <button type="button" class="btn btn-secondary btn-block" id="install-btn" hidden>📲 অ্যাপ ইনস্টল করুন</button>
      </section>

    </main>

    <div class="toast-container" id="toast-container" aria-live="polite"></div>

    <script type="module">
      import { initFirebase, showToast } from './js/firebase.js';
      import { signIn, homeFor, currentSession, handoffUrl } from './js/auth.js';
      import { orgInfo } from './js/data.js';
      import { mountInstallButton } from './js/install.js';
      import { mountExitGuard } from './js/back-button.js';

      const ALLOWED_PAGES = ['student.html', 'teacher.html', 'admin.html'];

      const form = document.getElementById('login-form');
      const input = document.getElementById('login-input');
      const password = document.getElementById('login-password');
      const loginBtn = document.getElementById('login-btn');
      const errorBox = document.getElementById('login-error');
      const togglePassword = document.getElementById('toggle-password');

      const showError = (message) => {
        errorBox.textContent = message || '';
        errorBox.classList.toggle('visible', Boolean(message));
      };

      /**
       * The institute profile the admin writes in Settings (name, address,
       * mobile, email) also introduces the app here — so a coaching centre sees
       * its own identity on the login screen, not a hard-coded brand.
       */
      const renderOrgLine = () => {
        const line = document.getElementById('org-line');
        if (!line) return;
        const org = orgInfo();
        const nameEl = document.getElementById('org-line-name');
        const detailEl = document.getElementById('org-line-detail');
        if (nameEl) nameEl.textContent = org.name;
        if (detailEl) detailEl.textContent = [org.address, org.contactLine].filter(Boolean).join(' · ');
        line.hidden = !org.name;
      };

      const setLoading = (isLoading) => {
        loginBtn.disabled = isLoading;
        loginBtn.innerHTML = isLoading
          ? '<span class="spinner" aria-hidden="true"></span> লগিন হচ্ছে…'
          : 'লগিন করুন';
      };

      /** Only allow redirects to our own dashboards. */
      const safeNext = () => {
        const next = new URLSearchParams(window.location.search).get('next');
        return ALLOWED_PAGES.includes(next) ? next : null;
      };

      togglePassword.addEventListener('click', () => {
        const show = password.type === 'password';
        password.type = show ? 'text' : 'password';
        togglePassword.textContent = show ? 'লুকান' : 'দেখুন';
        togglePassword.setAttribute('aria-pressed', String(show));
        password.focus();
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        showError('');

        const identifier = input.value.trim();
        const secret = password.value;

        if (!identifier || !secret) {
          showError('ইউজারনেইম/স্টুডেন্ট আইডি এবং পাসওয়ার্ড দুটোই দিন।');
          (!identifier ? input : password).focus();
          return;
        }

        setLoading(true);
        try {
          /* One login for every user type: signIn() detects the role from the
             account and we route to that role's own portal. */
          const session = await signIn(identifier, secret);
          showToast(`সফলভাবে লগিন হয়েছে — ${session.name}`, 'success');
          // Always land on Home first ({ home: true }) — a remembered tab or a
          // stale ?next target must not decide where a fresh login opens.
          window.location.replace(handoffUrl(safeNext() || homeFor(session.role), session, { home: true }));
        } catch (error) {
          console.warn('[Active Plus] Login failed:', error.code || '', error.message);
          showError(error.message || 'লগিন করা যায়নি। আবার চেষ্টা করুন।');
          setLoading(false);
          password.select();
        }
      });

      const boot = async () => {
        renderOrgLine();
        mountInstallButton('#install-btn');
        /* The login page has no screens of its own, but Back must not close the
           installed app by accident either: the first press warns, the second
           one leaves. */
        mountExitGuard({ toast: (message, kind, ms) => showToast(message, kind, ms) });

        const session = currentSession();
        if (session) {
          window.location.replace(handoffUrl(safeNext() || homeFor(session.role), session));
          return;
        }

        try {
          await initFirebase();
        } catch (error) {
          console.error('[Active Plus] init error:', error);
        }
        input.focus({ preventScroll: true });
      };

      boot();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('service-worker.js').catch((error) => {
            console.warn('[Active Plus] Service worker registration failed:', error.message);
          });
        });
      }
      /* Boot-watchdog marker: the module finished wiring this page. */
      document.body.dataset.boot = 'ok';
</script>

    <!-- Boot watchdog: if the module script never finished (very old browser,
         a blocked script, or an error while booting) say so and offer a reload
         instead of leaving a spinner or skeleton on screen forever. -->
    <script>
      (function () {
        var shown = false;
        function booted() { return document.body && document.body.getAttribute('data-boot') === 'ok'; }
        function showBootHelp() {
          if (shown || booted()) return;
          shown = true;
          var box = document.createElement('div');
          box.setAttribute('role', 'alert');
          box.setAttribute('style', 'position:fixed;left:0;right:0;bottom:0;z-index:99999;display:flex;justify-content:center;padding:1rem;');
          box.innerHTML =
            '<div style="max-width:26rem;width:100%;background:#1b1f27;color:#f1f5f9;border:1px solid #374151;' +
              'border-radius:1rem;padding:1rem 1.15rem;box-shadow:0 12px 32px rgba(0,0,0,.55);' +
              'font-family:\'Hind Siliguri\',\'Noto Sans Bengali\',system-ui,sans-serif">' +
              '<strong style="display:block;font-size:1.02rem;margin-bottom:.3rem">⚠️ পেজটি ঠিকমতো লোড হয়নি</strong>' +
              '<p style="margin:.2rem 0;font-size:.9rem;line-height:1.65;color:#cbd5e1">' +
                'ইন্টারনেট সংযোগ দেখে পেজটি রিফ্রেশ করুন। পুরনো ব্রাউজারে সমস্যা হলে সর্বশেষ Chrome বা Firefox দিয়ে খুলুন।' +
              '</p>' +
              '<div style="display:flex;gap:.5rem;margin-top:.6rem">' +
                '<button data-boot-act="retry" style="flex:1;background:#2563eb;border:0;color:#fff;border-radius:.6rem;' +
                  'padding:.55rem .9rem;font-size:.92rem;cursor:pointer">🔄 রিফ্রেশ করুন</button>' +
                '<button data-boot-act="dismiss" style="background:transparent;border:1px solid #4b5563;color:#cbd5e1;' +
                  'border-radius:.6rem;padding:.55rem .9rem;font-size:.92rem;cursor:pointer">পরে দেখব</button>' +
              '</div>' +
            '</div>';
          document.body.appendChild(box);
          box.querySelector('[data-boot-act="retry"]').addEventListener('click', function () { window.location.reload(); });
          box.querySelector('[data-boot-act="dismiss"]').addEventListener('click', function () { box.remove(); shown = false; });
        }
        /* Module scripts have either run or failed by window 'load'. A couple of
           generous fallbacks cover browsers where 'load' itself is delayed. */
        window.addEventListener('load', function () { setTimeout(showBootHelp, 4000); });
        setTimeout(function () { if (document.readyState === 'complete') showBootHelp(); }, 12000);
        setTimeout(showBootHelp, 30000);
      })();
    </script>

    <noscript>
      <div style="position:fixed;left:0;right:0;bottom:0;z-index:99999;display:flex;justify-content:center;padding:1rem;">
        <div style="max-width:26rem;width:100%;background:#1b1f27;color:#f1f5f9;border:1px solid #374151;border-radius:1rem;padding:1rem 1.15rem;font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif">
          <strong>⚠️ জাভাস্ক্রিপ্ট বন্ধ আছে</strong>
          <p style="margin:.3rem 0;font-size:.9rem;line-height:1.6;color:#cbd5e1">Active Plus চালাতে ব্রাউজারে JavaScript চালু থাকতে হবে। JavaScript অন করে পেজটি আবার খুলুন।</p>
        </div>
      </div>
    </noscript>
  </body>
</html>
