<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Plus - Coaching Management System</title>
    <meta name="description" content="Active Plus Coaching Management System">
    <meta name="author" content="Senior Full-Stack Architect">
    
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskar&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    
    <style>
      :root {
        --primary: #2d3748;
        --secondary: #4a5568;
        --accent: #4299e1;
        --success: #38a169;
        --warning: #d69e2e;
        --error: #e53e3e;
        --light: #edf2f7;
        --dark: #1a202c;
        --white: #ffffff;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Noto Naskar', sans-serif, system-ui, -apple-system, sans-serif;
        background: var(--primary);
        color: var(--white);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .login-container {
        width: 100%; max-width: 400px; padding: 2rem; text-align: center;
      }

      .logo { width: 80px; height: 80px; margin: 0 auto 2rem;
        background: linear-gradient(135deg, #4299e1, #3182ce);
        border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 2rem;
      }
      .logo-icon { width: 40px; height: 40px; background: white; border-radius: 10px;
        display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--primary); }

      h1 { font-size: 1.75rem; margin-bottom: 0.5rem; font-weight: 600; }
      .subtitle { color: #a0aec0; font-size: 0.875rem; margin-bottom: 2rem; }

      .login-card {
        background: rgba(255,255,255,0.05); backdrop-filter: blur(10px);
        border-radius: 16px; padding: 2.5rem 2rem; margin: 1rem;
        border: 1px solid rgba(255,255,255,0.1);
      }

      .form-group { margin-bottom: 1.5rem; text-align: left; }
      .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: #cbd5e0; }
      .form-group input {
        width: 100%; padding: 0.875rem 1rem; background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: var(--white);
        font-size: 1rem; transition: all 0.2s ease;
      }
      .form-group input::placeholder { color: rgba(255,255,255,0.5); }
      .form-group input:focus { outline: none; border-color: #4299e1; background: rgba(255,255,255,0.15); }

      .btn-login {
        width: 100%; padding: 1rem; background: var(--accent); color: var(--white);
        border: none; border-radius: 8px; font-size: 1rem; font-weight: 500;
        cursor: pointer; transition: background 0.2s ease; margin-top: 0.5rem;
      }
      .btn-login:hover { background: #2b6cb0; }

      .status-bar {
        margin-top: 1.5rem; font-size: 0.75rem; color: #718096;
      }
      .status-bar.connected { color: #38a169; }
      .status-bar.disconnected { color: #e53e3e; }

      .role-options { margin-top: 2rem; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto; }
      .role-option {
        display: block; padding: 0.875rem 1rem; margin: 0.5rem 0;
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px; color: #cbd5e0; text-decoration: none; font-size: 0.875rem;
        transition: all 0.2s ease; cursor: pointer;
      }
      .role-option:hover { background: rgba(255,255,255,0.1); color: #e2e8f0; }
      .role-option.active { background: var(--accent); color: var(--white); border-color: var(--accent); }

      .hint { margin-top: 2rem; font-size: 0.7rem; color: #718096; }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="logo"><div class="logo-icon">📚</div></div>
      <h1>Active Plus</h1>
      <div class="subtitle">Coaching Management System</div>
      <div class="login-card">
        <div class="form-group"><label>Email or Student ID</label><input type="text" id="login-input" placeholder="Enter email or student ID" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="login-password" placeholder="Enter password" required></div>
        <button class="btn-login" id="login-btn">Login</div>
        <div class="status-bar" id="status-bar"><span id="status-text">Checking database connection...</span><span id="status-dot" style="display:none; margin-left: 0.5rem;">●</span></div>
      </div>
      <div class="role-options">
        <div class="role-option active" data-role="student">Student</div>
        <div class="role-option" data-role="teacher">Teacher</div>
        <div class="role-option" data-role="admin">Admin</div>
      </div>
      <p class="hint">© 2026 Active Plus Coaching Management System</p>
    </div>

    <script type="module">
      import { initFirebase, getDatabase, checkConnectionStatus,
               isAuthenticated, signInWithEmailAndPassword, signOut,
               firebaseConfig, dbRefs, showToast } from './js/firebase.js';

      document.addEventListener('DOMContentLoaded', async () => {
        try {
          await initFirebase();
          const isConnected = await checkConnectionStatus();
          updateConnectionUI(isConnected);

          const user = isAuthenticated();
          if (!user) {
            setupLoginForm();
          } else {
            const userRole = getUserRole();
            const redirectMap = { 'admin': 'admin.html', 'teacher': 'teacher.html', 'student': 'student.html' };
            window.location.href = redirectMap[userRole] || 'index.html';
          }
        } catch (error) {
          showStatus('Error: ' + error.message, 'error');
        }
      });

      function setupLoginForm() {
        const loginBtn = document.getElementById('login-btn');
        const loginInput = document.getElementById('login-input');
        const loginPassword = document.getElementById('login-password');
        const statusBar = document.getElementById('status-bar');
        const statusText = document.getElementById('status-text');
        const roleOptions = document.querySelectorAll('.role-option');

        roleOptions.forEach(opt => {
          opt.addEventListener('click', () => {
            roleOptions.forEach(o => o.classList.remove('active'));
            opt.classList.add('active');
          });
        });

        loginInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') loginPassword.focus(); });
        loginPassword.addEventListener('keypress', (e) => { if (e.key === 'Enter') loginBtn.click(); });

        loginBtn.addEventListener('click', async () => {
          const identifier = loginInput.value.trim();
          const password = loginPassword.value.trim();
          const selectedRole = document.querySelector('.role-option.active')?.dataset.role;

          if (!identifier || !password || !selectedRole) {
            showStatus('Please fill in all fields', 'error'); return;
          }

          showStatus('Logging in...', 'connected');

          try {
            const result = await signInWithEmailAndPassword(identifier, password);
            if (result.user) {
              setUserRole(selectedRole);
              const redirectMap = { 'admin': 'admin.html', 'teacher': 'teacher.html', 'student': 'student.html' };
              localStorage.setItem('activeplus_redirect', redirectMap[selectedRole]);
              window.location.href = redirectMap[selectedRole];
            }
          } catch (loginError) {
            performLogin(identifier, password, selectedRole);
          }
        });
      }

      function performLogin(identifier, password, role) {
        const userSession = { role, identifier, loginTime: new Date().toISOString() };
        saveUserSession(userSession);
        setUserRole(role);

        if (role === 'student' && validateStudentId(identifier)) {
          const idSpan = document.createElement('span');
          idSpan.className = 'student-id-format';
          idSpan.textContent = identifier;
          const statusBar = document.getElementById('status-bar');
          if (statusBar && !document.querySelector('.student-id-format')) {
            statusBar.insertAdjacentElement('afterend', idSpan);
          }
        }
      }
    </script>
  </body>
</html>
